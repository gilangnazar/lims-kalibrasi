name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.22.2 = lowest 22.x the web test tools accept (jsdom 31; API floor is 22.12 for Puppeteer); 26 = dev LTS (.nvmrc)
        node: ['22.22.2', '26']

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Mirrors api/.env.test.example. DB_NAME must end in _test (the test setup drops its tables).
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lims_kalibrasi_test
      JWT_SECRET: ci-test-secret
      JWT_EXPIRE: 1h
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install
        run: npm run install:all

      - name: Lint
        run: npm run lint

      # npm 12 blocks Puppeteer's install script, so fetch its headless Chrome explicitly (PDF tests).
      - name: Headless Chrome for PDFs
        run: npm --prefix api run pdf:install

      - name: API tests
        run: npm --prefix api test

      - name: Web tests
        run: npm --prefix web test

      - name: Web build
        run: npm --prefix web run build
